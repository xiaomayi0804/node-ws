<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的静态网页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    header {
      background: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #444;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 20px;
    }
    footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>欢迎来到我的静态网页</h1>
  </header>

  <nav>
    <a href="#home">首页</a>
    <a href="#about">关于</a>
    <a href="#contact">联系</a>
  </nav>

  <main>
    <section id="home">
      <h2>首页</h2>
      <p>这是一个简单的静态网页示例。</p>
    </section>

    <section id="about">
      <h2>关于</h2>
      <p>这里可以写一些关于你的介绍，比如项目、爱好或公司信息。</p>
    </section>

    <section id="contact">
      <h2>联系</h2>
      <p>邮箱: example@example.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 我的静态网页</p>
  </footer>
</body>
</html>
